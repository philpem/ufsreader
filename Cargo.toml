[package]
name = "ufsreader"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Read-only, bounded-I/O UFS1 filesystem listing and extraction"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
cap-std = "3"
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
